name: Remove generated Vercel output

on:
  push:
    branches: [agent/vercel-production-polish]
    paths:
      - .github/workflows/remove-vercel-output.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove generated build output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          shutil.rmtree('.vercel', ignore_errors=True)
          ignore = Path('.gitignore')
          content = ignore.read_text(encoding='utf-8')
          if '.vercel/' not in content.splitlines():
              content = content.rstrip() + '\n.vercel/\n'
              ignore.write_text(content, encoding='utf-8')
          Path('.github/workflows/remove-vercel-output.yml').unlink()
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated Vercel output"
          git push
